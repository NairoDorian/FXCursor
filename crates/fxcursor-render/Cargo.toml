[package]
name = "fxcursor-render"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared wgpu renderer for FXCursor: CPU spring-chain physics, 4-layer ribbon mesh and instanced SDF effects"

[dependencies]
fxcursor-protocol = { path = "../fxcursor-protocol" }
