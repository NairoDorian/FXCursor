[package]
name = "fxcursor-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fxcursor-daemon"
path = "src/main.rs"

[dependencies]
fxcursor-protocol = { path = "../fxcursor-protocol" }
fxcursor-render = { path = "../fxcursor-render" }

# Graphics & Compute
wgpu = "^30.0.1"
bytemuck = { version = "^1.25.2", features = ["derive"] }
pollster = "^1.0.1"
raw-window-handle = "^0.6.2"

# Windowing & Events
winit = "0.31.0-beta.3"

# System Tray & Hotkeys
tray-icon = "^0.24.2"
muda = "^0.19.3"

# Logging & Concurrency
log = "^0.4.34"
env_logger = "^0.11.11"
parking_lot = "^0.12.5"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.151"
directories = "^6.0.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "^0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }
windows-sys = { version = "^0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", features = [
    "CGEvent",
    "CGEventTypes",
    "CGEventSource",
    "CGRemoteOperation",
] }
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSApplication", "NSWindow"] }
objc2-foundation = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
