[package]
name = "project_cursor"
version = "0.1.0"
edition = "2021"

[dependencies]
# Windowing and Graphics
winit = { version = "0.29", features = ["rwh_06"] }
wgpu = "0.19"

# GUI (egui) integration
egui = "0.26"
egui-wgpu = { version = "0.26", features = ["winit"] }
egui-winit = { version = "0.26", features = ["links"] }

# Input
device_query = "1.1"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"

# System Integration
tray-icon = "0.14"

# Utilities
log = "0.4"
env_logger = "0.11"
raw-window-handle = "0.6"
bytemuck = { version = "1.15", features = ["derive"] }
instant = "0.1"
pollster = "0.3"


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
opt-level = "z"     # Optimize for size

lto = true          # Link Time Optimization
codegen-units = 1   # Reduce parallel code generation units for better optimization
panic = "abort"     # Remove stack unwinding code to reduce size
strip = true        # Strip symbols and debuginfo
