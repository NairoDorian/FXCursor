[package]
name = "fxcursor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "fxcursor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2.6.3", features = [] }

[dependencies]
fxcursor-protocol = { path = "../crates/fxcursor-protocol" }
fxcursor-render = { path = "../crates/fxcursor-render" }
tauri = { version = "^2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "^2.4.4"
tauri-plugin-shell = "^2.3.6"
tauri-plugin-global-shortcut = "^2.3.2"
tauri-plugin-autostart = "^2.5.1"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.151"
log = "^0.4.34"
env_logger = "^0.11.11"
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
directories = "^6.0.0"
bytemuck = { version = "^1.25.2", features = ["derive"] }
raw-window-handle = "^0.6.2"
pollster = "^1.0.1"
wgpu = "^30.0.1"
png = "^0.18.1"

# Cursor polling fallback for platforms without an OS-level mouse hook (see src/tracker.rs).
[target.'cfg(not(windows))'.dependencies]
device_query = "^4.0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "^0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Pipes",
] }
windows-sys = { version = "^0.61.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_Media",
] }
webview2-com = "^0.39.1"
