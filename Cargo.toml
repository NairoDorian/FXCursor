[workspace]
resolver = "2"
members = [
    "crates/fxcursor-protocol",
    "crates/fxcursor-render",
    "crates/fxcursor-daemon",
    "src-tauri",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
authors = ["FXCursor Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/NairoDorian/FXCursor"

[profile.dev]
opt-level = 0
debug = 1
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false

# Heavy dependencies compile with opt-level=3 once
[profile.release.package."*"]
opt-level = 3
codegen-units = 1

# Tauri 3 integration follows Handy_V2; the Specta family must resolve from one source.
[patch.crates-io]
tauri-specta = { git = "https://github.com/NairoDorian/tauri-specta-v3" }
specta = { git = "https://github.com/specta-rs/specta.git", branch = "main" }
specta-macros = { git = "https://github.com/specta-rs/specta.git", branch = "main" }
specta-serde = { git = "https://github.com/specta-rs/specta.git", branch = "main" }
specta-typescript = { git = "https://github.com/specta-rs/specta.git", branch = "main" }
specta-util = { git = "https://github.com/specta-rs/specta.git", branch = "main" }
